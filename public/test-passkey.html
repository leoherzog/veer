<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Passkey Test</title>
  <style>
    body { font-family: monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; overflow-x: auto; border-radius: 4px; }
    .field { margin: .25rem 0; }
    .label { color: #9cdcfe; }
    .value { color: #ce9178; }
    #output { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Passkey Registration Test</h1>
  <p>User ID: <input id="userId" value="test-user-001" size="40"></p>
  <p>User Name: <input id="userName" value="test@example.com" size="40"></p>
  <button id="create">Create Passkey</button>
  <div id="output"></div>

  <script>
    function bufToBase64url(buf) {
      const bytes = new Uint8Array(buf);
      let str = '';
      for (const b of bytes) str += String.fromCharCode(b);
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function bufToHex(buf) {
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function parseAAGUID(authData) {
      // AAGUID is bytes 37-52 of authenticatorData
      const aaguid = authData.slice(37, 53);
      const hex = bufToHex(aaguid);
      return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
    }

    document.getElementById('create').addEventListener('click', async () => {
      const output = document.getElementById('output');
      const userId = document.getElementById('userId').value;
      const userName = document.getElementById('userName').value;

      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));

        const credential = await navigator.credentials.create({
          publicKey: {
            rp: { name: 'Veer', id: location.hostname },
            user: {
              id: new TextEncoder().encode(userId),
              name: userName,
              displayName: userName,
            },
            challenge,
            pubKeyCredParams: [
              { alg: -7, type: 'public-key' },   // ES256
              { alg: -257, type: 'public-key' },  // RS256
            ],
            authenticatorSelection: {
              residentKey: 'preferred',
              userVerification: 'preferred',
            },
            timeout: 60000,
          },
        });

        const response = credential.response;
        const authData = new Uint8Array(response.getAuthenticatorData());
        const transports = response.getTransports?.() || [];
        const aaguid = parseAAGUID(authData);

        // Counter is bytes 33-36 of authenticatorData (big-endian uint32)
        const counterView = new DataView(authData.buffer, 33, 4);
        const counter = counterView.getUint32(0);

        // Flags byte 32: bit 0 = UP, bit 2 = UV, bit 3 = BE, bit 6 = AT, bit 4 = BS
        const flags = authData[32];
        const backedUp = !!(flags & 0x10);     // BS flag
        const deviceType = (flags & 0x08) ? 'multiDevice' : 'singleDevice'; // BE flag

        const credentialID = bufToBase64url(credential.rawId);

        // Extract COSE public key from authenticatorData (NOT getPublicKey() which is SPKI)
        // Layout: rpIdHash(32) + flags(1) + counter(4) + aaguid(16) + credIdLen(2) + credId(N) + coseKey(rest)
        const credIdLen = (authData[53] << 8) | authData[54];
        const coseKeyStart = 55 + credIdLen;
        const cosePublicKey = authData.slice(coseKeyStart);
        const publicKeyB64 = bufToBase64url(cosePublicKey);

        const row = {
          id: crypto.randomUUID(),
          name: 'Test Passkey',
          publicKey: publicKeyB64,
          userId,
          credentialID,
          counter,
          deviceType,
          backedUp,
          transports: JSON.stringify(transports),
          createdAt: Math.floor(Date.now() / 1000),
          aaguid,
        };

        console.log('Passkey DB row:', row);

        output.innerHTML = `
          <h2>Credential Created</h2>
          <pre>${Object.entries(row).map(([k, v]) =>
            `<span class="label">${k}</span>: <span class="value">${JSON.stringify(v)}</span>`
          ).join('\n')}</pre>

          <h2>SQL INSERT</h2>
          <pre>INSERT INTO passkey (id, name, publicKey, userId, credentialID, counter, deviceType, backedUp, transports, createdAt, aaguid)
VALUES (
  '${row.id}',
  '${row.name}',
  '${row.publicKey}',
  '${row.userId}',
  '${row.credentialID}',
  ${row.counter},
  '${row.deviceType}',
  ${row.backedUp ? 1 : 0},
  '${row.transports}',
  ${row.createdAt},
  '${row.aaguid}'
);</pre>
        `;
      } catch (err) {
        output.innerHTML = `<pre style="color:#f44">Error: ${err.message}\n${err.stack}</pre>`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
