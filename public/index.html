<!DOCTYPE html>
<html class="wa-theme-awesome wa-palette-bright wa-brand-purple wa-light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'wa-dark' : 'wa-light');
      document.documentElement.classList.remove('wa-light', 'wa-dark');
      document.documentElement.classList.add(theme);
    })();
  </script>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body>
  <wa-page>
    <div slot="header" id="nav"></div>
    <main id="main" tabindex="-1">
      <div class="wa-cluster wa-justify-content-center centered-state">
        <wa-spinner></wa-spinner>
      </div>
    </main>
  </wa-page>
  <script type="module" src="/dist/app.js"></script>
</body>
</html>
